    <script>
      (function () {
        // Prevent Vite WebSocket connection errors from bubbling up as unhandled rejections
        window.addEventListener('unhandledrejection', function (event) {
          const reason = event.reason;
          const msg = (reason && (reason.message || String(reason))) || '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('websocket') ||
            msg.includes('vite')
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        });

        window.addEventListener('error', function (event) {
          const msg = event.message || '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('websocket') ||
            msg.includes('vite')
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        });

        // Intercept Vite HMR WebSocket connection attempts cleanly
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function (url, protocols) {
            const isViteHmr =
              (typeof protocols === 'string' && protocols.includes('vite-hmr')) ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite') || url.includes('token=')));

            if (isViteHmr) {
              const target = new EventTarget();
              target.CONNECTING = 0;
              target.OPEN = 1;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.readyState = target.OPEN;
              target.url = url;
              target.protocol = 'vite-hmr';
              target.extensions = '';
              target.bufferedAmount = 0;
              target.binaryType = 'blob';
              target.send = function () {};
              target.close = function () {};
              target.onopen = null;
              target.onclose = null;
              target.onerror = null;
              target.onmessage = null;
              queueMicrotask(() => {
                try {
                  if (typeof target.onopen === 'function') target.onopen(new Event('open'));
                  target.dispatchEvent(new Event('open'));
                } catch (_) {}
              });
              return target;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
